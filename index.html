<!doctype html>
<html lang="en">
<head>

<style>
/* Layout: one question per screen, centered column, progress rail on top. Monochrome, matched to the black-and-white S logo. */
:root{
  --bg:#0A0A0A; --bg-2:#141414; --line:#2A2A2A; --fg:#FFFFFF; --muted:#8F8F8F; --faint:#4D4D4D;
  --accent:#FFFFFF; --accent-ink:#0A0A0A; --pressed:rgba(255,255,255,.07); --error:#FF7A7A;
  --display:"Syne",ui-sans-serif,system-ui,sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* Logo watermark: the JPG is black lines on white; invert + screen turns it into white lines on the black page */
.mark-bg{position:fixed;z-index:0;pointer-events:none;
  width:min(115vh,140vw);aspect-ratio:1;right:-30vw;top:50%;transform:translateY(-50%) rotate(-8deg);
  background:url("logo-white.png") center/contain no-repeat;opacity:.1}
@media (min-width:900px){.mark-bg{right:-12vw;opacity:.12}}
.shell{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:28px;width:auto;display:block}
[hidden]{display:none!important}
.shell{min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:20px;max-width:640px;width:100%;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--muted)}
.count{white-space:nowrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.rail{max-width:640px;width:100%;margin:0 auto;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--accent);transition:width .45s cubic-bezier(.2,.8,.2,1)}
main{flex:1;display:flex;align-items:center;max-width:640px;width:100%;margin:0 auto;padding-block:32px 24px}
.step{width:100%;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
.step.back{animation-name:inBack}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.rail i{transition:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:0 0 12px;text-wrap:balance}
h1{font-size:clamp(36px,8vw,56px)}
h2{font-size:clamp(26px,5.5vw,38px)}
.hint{color:var(--muted);margin:0 0 28px;max-width:52ch}
.fields{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea{
  width:100%;background:transparent;color:var(--fg);font:500 19px/1.3 var(--body);
  border:0;border-bottom:2px solid var(--line);padding:10px 2px;outline:none;border-radius:0;transition:border-color .2s}
textarea{font-size:18px;resize:vertical;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:14px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus{border-color:var(--accent)}
.prefix{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);transition:border-color .2s}
.prefix:focus-within{border-color:var(--accent)}
.prefix b{font:600 22px var(--body);color:var(--muted)}
.prefix input{border:0}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--bg-2);cursor:pointer;font-weight:600;font-size:17px;color:var(--fg);text-align:left;font-family:var(--body);transition:border-color .15s,background .15s,transform .1s}
.choice:hover{border-color:#555}
.choice:active{transform:scale(.99)}
.choice kbd{font:700 12px var(--body);width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--muted);flex:none}
.choice[aria-pressed=true]{border-color:var(--accent);background:var(--pressed)}
.choice[aria-pressed=true] kbd{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:15px;color:var(--muted);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px;flex:none}
.err{color:var(--error);font-size:14px;margin:14px 0 0;min-height:1.4em}
.actions{display:flex;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:999px;padding:15px 28px;font:700 16px var(--body);cursor:pointer;
  background:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:wait}
.ghost{background:none;border:0;color:var(--muted);font:600 15px var(--body);cursor:pointer;padding:10px 4px}
.ghost:hover{color:var(--fg)}
.enter{font-size:13px;color:var(--muted)}
.enter b{color:var(--fg)}
@media (hover:none){.enter{display:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.perks{display:grid;gap:10px;margin:0 0 32px;padding:0;list-style:none}
.perks li{display:flex;gap:12px;align-items:baseline;color:var(--fg)}
.perks li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.meta{color:var(--muted);font-size:14px}
footer{max-width:640px;width:100%;margin:0 auto;padding-block:16px 24px;color:var(--faint);font-size:12px}
.review{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:8px}
.review div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.review div:first-child{border-top:0}
.review dt{color:var(--muted)}
.review dd{margin:0;word-break:break-word}
.review button{all:unset;color:var(--accent);cursor:pointer;font-size:13px;font-weight:600}
.fields{gap:22px}
.req{color:var(--faint);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--bg-2);color:var(--fg);border-radius:999px;
  padding:10px 16px;font:600 15px var(--body);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:#555}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choices.two .choice{padding:13px 16px;font-size:16px}
.consent{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg-2);cursor:pointer;font-weight:600}
.consent input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.ftext{font-size:15px;color:var(--muted);font-weight:500;margin:0}
input[type=date]{min-height:48px}
</style>
</head>
<body>
<div class="mark-bg" aria-hidden="true"></div>
<div class="shell">
  <header>
    <div class="brand"><img src="logo-white.png" alt="">Scale<span>+</span> Agency</div>
    <div class="count" id="count"></div>
  </header>
  <div class="rail" aria-hidden="true"><i id="bar"></i></div>
  <main><form id="form" novalidate autocomplete="on" style="width:100%"></form></main>
  <footer>Your answers are private and only seen by the Scale+ team. Your progress is saved on this device, so you can come back and finish later.</footer>
</div>

<script>
/* ---- Google Form backend: answers land in the existing "Scale+ Onboarding Form" ---- */
const FORM_VIEW = "https://docs.google.com/forms/d/e/1FAIpQLSdvgDiZ6uW1hOfQsf2RNdou-PpHgsAzWPyfm3WHxkQf3gHBEA/viewform";
// Google Apps Script web app that saves answers into the Google Form (see receiver/Code.gs). Empty = use the pre-filled Google Form.
const SCRIPT_URL = "";
const STORE = "scaleplus-onboarding";
const COMMIT = "I understand and I am committed to this process";

  "Girl-Girl Content","Boy-Girl Content","Masturbation Content","Anal","JOI Videos (Jerk-off instructions)","Twerk videos","Dildo Content"];

/* Each field: e = Google entry id, t = type, l = label, r = required */
const steps = [
  { id:"welcome" },
  { title:"Let's start with you", hint:"The basics, so we can set up your account.", fields:[
    {e:623545884, t:"text", l:"Full legal name", p:"Jessica Ann Miller", r:1, ac:"name"},
    {e:242793241, t:"text", l:"Online name (if different from your legal name)", p:"Jess", r:1},
    {e:2061273468, t:"email", l:"E-mail address", p:"you@email.com", r:1, ac:"email"},
    {e:880041910, t:"tel", l:"Phone number, with country code", p:"+1 305 555 0123", r:1, ac:"tel"} ]},
  { title:"Your socials", hint:"Your usernames on each platform. Leave empty the ones you don't use.", fields:[
    {k:"ig", t:"handle", l:"Instagram"}, {k:"tt", t:"handle", l:"TikTok"}, {k:"tw", t:"handle", l:"Twitter / X"} ]},
  { title:"Tell us about yourself", hint:"The more details, the more convincing the chatting on your account will be.", fields:[
    {e:64789520, t:"long", l:"Your interests, hobbies, personality, the music you listen to, what you like to eat, your favorite singer, and some background", p:"I'm a Miami girl, I love the beach, R&B, sushi...", r:1} ]},
  { title:"How should we talk as you?", hint:"Describe your attitude, so our writers chat exactly like you would.", fields:[
    {e:1481455894, t:"long", l:"Your attitude and the way you talk", p:"Example: bubbly, always teasing and joking around, but can get really sexual and very descriptive", r:1} ]},
  { title:"A few personal details", fields:[
    {e:273796012, t:"date", l:"Birthday", r:1},
    {e:327921896, t:"text", l:"Height", p:"5'6\" / 168 cm"},
    {e:2098313496, t:"text", l:"Zodiac sign", p:"Leo"},
    {e:2031284993, t:"text", l:"Sexual orientation", p:"Straight, bi...", r:1} ]},
  { title:"Where you're from", fields:[
    {e:706606655, t:"text", l:"Where are you based now?", p:"Miami, USA", r:1},
    {e:473913278, t:"text", l:"Where are you from originally?", p:"Bogotá, Colombia", r:1},
    {e:967140255, t:"text", l:"Languages spoken", p:"English, Spanish", r:1},
    {e:1534987497, t:"text", l:"Ethnicity", p:"Latina"} ]},
  { title:"Your look", fields:[
    {e:1875957748, t:"text", l:"Bra size", p:"34C", r:1},
    {e:727737457, t:"text", l:"Shoe size", p:"US 7"},
    {e:400978976, t:"long", l:"Which part of your body do you find the sexiest?", r:1},
    {e:1728033070, t:"long", l:"How would you describe your physical appearance?"} ]},
  { title:"Your everyday life", fields:[
    {e:789545, t:"text", l:"Favorite color", p:"Pink", r:1},
    {e:1039791134, t:"text", l:"Did you go to college? What major?", p:"Yes, Psychology"},
    {e:190339400, t:"text", l:"Do you have kids? If yes, how many?", p:"No", r:1},
    {e:1290894391, t:"text", l:"Do you have pets? Name, kind, age?", p:"Luna, French bulldog, 3"} ]},
  { title:"Your activities", fields:[
    {e:2007998572, t:"text", l:"Do you play sports?", p:"Gym, pilates", r:1},
    {e:733508957, t:"text", l:"What places have you visited?", p:"Cancún, Paris, NYC", r:1},
    {e:1171401098, t:"text", l:"What is your work other than OnlyFans?", p:"Bartender", r:1} ]},
  { title:"What content are you comfortable sharing?", hint:"Pick everything you're OK with. You can change this anytime with your manager.", fields:[
    {e:1217121594, t:"multi", opts:CONTENT, r:1} ]},
  { title:"Working with fans", fields:[
    {e:331608123, t:"yn", l:"Do you accept video calls from OF fans?", r:1},
    {e:608522380, t:"yn", l:"Are you willing to make custom requests?", r:1},
    {e:1956987537, t:"yn", l:"Are you willing to go LIVE on OF?"},
    {e:2106965277, t:"text", l:"Anyone featured in your OF content? Add their @ so we can tag them", p:"@name, or \"No one\"", r:1} ]},
  { title:"Last step", fields:[
    {e:2047260324, t:"long", l:"Anything else you want to mention that we haven't asked?"},
    {e:1148321390, t:"consent", l:"I understand that making a high amount of money requires great commitment from me. Scale+ expects regular content and regular posting on TikTok and Instagram.", r:1} ],
    submitLabel:"Send my answers" },
  { id:"done" }
];

const data = {};
const FIELD_STEPS = steps.filter(s=>s.fields).length;
let i = 0, dir = 1;
const form = document.getElementById("form");

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const keyOf = f => f.k || "e"+f.e;
const reqMark = f => f.r ? "" : ` <span class="req">(optional)</span>`;
function socials(){return [data.ig&&"IG @"+data.ig, data.tt&&"TikTok @"+data.tt, data.tw&&"Twitter @"+data.tw].filter(Boolean).join(" · ")}
function ageFrom(iso){ if(!iso) return null; const b=new Date(iso+"T00:00:00"), n=new Date();
  let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; return a; }
function prettyDate(iso){ return new Date(iso+"T00:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); }

function fieldHTML(f){
  const k = keyOf(f), v = data[k];
  if(f.t==="handle") return `<label class="f">${f.l}<div class="prefix"><b>@</b><input type="text" data-k="${k}" autocapitalize="off" autocomplete="off" placeholder="yourname" value="${esc(v)}"></div></label>`;
  if(f.t==="long") return `<label class="f">${f.l}${reqMark(f)}<textarea data-k="${k}" placeholder="${esc(f.p||"")}">${esc(v)}</textarea></label>`;
  if(f.t==="yn") return `<div class="f" style="display:grid;gap:10px"><p class="ftext">${f.l}${reqMark(f)}</p><div class="choices two">${["Yes","No"].map((o,n)=>
      `<button type="button" class="choice" data-k="${k}" data-val="${o}" aria-pressed="${v===o}"><kbd>${"AB"[n]}</kbd>${o}</button>`).join("")}</div></div>`;
  if(f.t==="multi") return `<div class="chips" role="group" aria-label="Content types">${f.opts.map(o=>
      `<button type="button" class="chip" data-multi="${k}" data-val="${esc(o)}" aria-pressed="${(v||[]).includes(o)}">${esc(o)}</button>`).join("")}</div>`;
  if(f.t==="consent") return `<label class="consent"><input type="checkbox" data-k="${k}" ${v?"checked":""}><span>${f.l}</span></label>`;
  const type = f.t==="date" ? "date" : f.t;
  const extra = f.t==="tel" ? ` inputmode="tel"` : "";
  return `<label class="f">${f.l}${reqMark(f)}<input type="${type}" data-k="${k}"${extra} autocomplete="${f.ac||"off"}" placeholder="${esc(f.p||"")}" value="${esc(v)}"></label>`;
}

function render(){
  const s = steps[i];
  const n = steps.slice(0,i+1).filter(x=>x.fields).length;
  document.getElementById("count").textContent = s.fields ? `${n} / ${FIELD_STEPS}` : "";
  document.getElementById("bar").style.width = (s.id==="done" ? 100 : s.fields ? (n-1)/FIELD_STEPS*100 : 0) + "%";
  let body;
  if(s.id==="welcome") body = `
      <p class="eyebrow">Creator onboarding</p>
      <h1>Welcome to Scale+.</h1>
      <p class="hint">We're so pleased to have you with us. Please fill this out in full and with detail: it's how our team learns to run your account exactly like you would.</p>
      <ul class="perks"><li>About 10 minutes, ${FIELD_STEPS} short steps</li><li>Your progress is saved if you leave</li><li>Only the Scale+ team sees your answers</li></ul>
      <div class="actions"><button class="btn" type="submit">Let's start →</button></div>`;
  else if(s.id==="done") body = `
      <p class="eyebrow">All done</p>
      <h1>Thank you${data.e242793241?", "+esc(data.e242793241):""}.</h1>
      <p class="hint">Your manager now has everything needed to set up your account. We'll reach out very soon with next steps.</p>`;
  else body = `
      <h2>${s.title}</h2>${s.hint?`<p class="hint">${s.hint}</p>`:`<div style="height:16px"></div>`}
      <div class="fields">${s.fields.map(fieldHTML).join("")}</div>
      <p class="err" id="err" role="alert"></p>
      <div class="actions">
        <button class="btn" type="submit" id="next">${s.submitLabel||"Next →"}</button>
        <button class="ghost" type="button" id="back">← Back</button>
        <span class="enter">press <b>Enter ↵</b></span></div>`;
  form.innerHTML = `<div class="step${dir<0?" back":""}">${body}</div>`;
  window.scrollTo(0,0);
  const first = form.querySelector("input:not([type=checkbox]),textarea");
  if(first && matchMedia("(hover:hover)").matches) first.focus({preventScroll:true});
  persist();
}
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify({i,data})) }catch(e){} }

function collect(){
  form.querySelectorAll("[data-k]").forEach(el=>{
    if(el.classList.contains("choice")) return;
    data[el.dataset.k] = el.type==="checkbox" ? el.checked : el.value.trim().replace(el.closest(".prefix")?/^@/:/^$/,"");
  });
}
function validate(s){
  for(const f of s.fields){
    const v = data[keyOf(f)];
    if(f.t==="handle") continue;
    if(f.r && (v===undefined || v==="" || v===false || (Array.isArray(v)&&!v.length)))
      return f.t==="multi" ? "Pick at least one type of content." : f.t==="consent" ? "Please tick the box to confirm your commitment." : `Please fill in: ${f.l.split("?")[0].split(",")[0]}.`;
    if(f.t==="email" && v && !/^\S+@\S+\.\S+$/.test(v)) return "Please enter a valid e-mail address.";
    if(f.t==="tel" && v && v.replace(/\D/g,"").length<7) return "Please enter a valid phone number, with country code.";
    if(f.t==="date" && v){ const a=ageFrom(v); if(a===null||a<18) return "You must be 18 or older."; if(a>100) return "Please check your birthday."; }
  }
  if(s.fields.some(f=>f.t==="handle") && !socials()) return "Add at least one username.";
}

function next(){
  const s = steps[i];
  collect();
  const err = validate(s);
  if(err){ document.getElementById("err").textContent = err; return; }
  if(s.submitLabel) return submit();
  dir = 1; i++; render();
}

function buildAnswers(){
  const a = {};
  for(const s of steps) for(const f of (s.fields||[])){
    if(!f.e) continue;
    const v = data[keyOf(f)];
    if(f.t==="multi") a[f.e] = v || [];
    else if(f.t==="consent") a[f.e] = v ? COMMIT : "";
    else if(f.t==="date") a[f.e] = v ? prettyDate(v) : "";
    else a[f.e] = v || "";
  }
  a["969509483"] = socials();                          // IG, TikTok, Twitter usernames
  a["45020611"] = String(ageFrom(data.e273796012));    // Age, worked out from the birthday
  return a;
}

/* Backup route: Google's own form, pre-filled with every answer. She only taps "Submit" there. */
function prefillUrl(a){
  const p = new URLSearchParams({usp:"pp_url"});
  for(const [k,v] of Object.entries(a)) [].concat(v).forEach(x=>{ if(x!=="") p.append("entry."+k, x); });
  return FORM_VIEW + "?" + p.toString();
}

function showConfirmOnGoogle(a){
  document.getElementById("count").textContent = "";
  form.innerHTML = `<div class="step">
    <p class="eyebrow">One last click</p>
    <h2>Confirm your answers on Google</h2>
    <p class="hint">All your answers are already filled in. Tap the button, scroll to the bottom of the Google page and press <b>Submit</b> (or <b>Envoyer</b>). That's it.</p>
    <div class="actions"><a class="btn" href="${esc(prefillUrl(a))}" rel="noopener">Open and submit →</a></div></div>`;
}

async function submit(){
  const btn = document.getElementById("next");
  btn.disabled = true; btn.textContent = "Sending…";
  const answers = buildAnswers();
  if(!SCRIPT_URL){ showConfirmOnGoogle(answers); return; }
  try{
    const res = await fetch(SCRIPT_URL, {method:"POST", body: JSON.stringify({answers})});
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || "not saved");
    try{ localStorage.removeItem(STORE) }catch(e){}
    dir = 1; i = steps.length-1; render(); try{ localStorage.removeItem(STORE) }catch(e){}
  }catch(e){
    showConfirmOnGoogle(answers);   // never lose an application: fall back to Google's own form
  }
}

form.addEventListener("submit", e=>{ e.preventDefault(); if(i===0){dir=1;i=1;render()} else next(); });
form.addEventListener("click", e=>{
  const c = e.target.closest(".choice");
  if(c){ data[c.dataset.k]=c.dataset.val;
    form.querySelectorAll(`.choice[data-k="${c.dataset.k}"]`).forEach(b=>b.setAttribute("aria-pressed", b===c)); persist(); return; }
  const m = e.target.closest(".chip");
  if(m){ const k=m.dataset.multi, arr=data[k]||(data[k]=[]), v=m.dataset.val, on=!arr.includes(v);
    on ? arr.push(v) : arr.splice(arr.indexOf(v),1); m.setAttribute("aria-pressed", on); persist(); return; }
  if(e.target.id==="back"){ collect(); dir=-1; i=Math.max(0,i-1); render(); }
});
form.addEventListener("input", ()=>{ collect(); persist(); });

try{ const saved = JSON.parse(localStorage.getItem(STORE)); if(saved && saved.i < steps.length-1){ Object.assign(data, saved.data); i = saved.i; } }catch(e){}
render();
</script>
</body>
</html>
